<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>多功能网页合集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#121212;color:#fff;padding:15px;font-family:system-ui}
.title-sign{text-align:center;margin:8px 0;color:#60a5fa;font-size:18px}
#fullBtn{position:fixed;top:10px;right:200px;background:#ff6722;border:none;color:#fff;padding:6px 10px;border-radius:4px;z-index:999}
#musicJumpBtn{position:fixed;top:10px;right:90px;background:#c23631;border:none;color:#fff;padding:6px 10px;border-radius:4px;z-index:999}
.qiling-avatar{
    position:fixed;top:8px;right:10px;width:52px;height:52px;border-radius:50%;
    border:2px solid #60a5fa;z-index:1000;object-fit:cover;
}
.tab-box{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.tab{padding:10px 20px;border:none;border-radius:6px;background:#2563eb;color:#fff;font-size:16px}
.hide{display:none !important}
#gameCanvas{border:2px solid #4cd964;background:#000;margin:0 auto;display:block}
.info{margin:12px 0;font-size:18px;text-align:center}
.panel{border:1px solid #444;border-radius:8px;padding:12px;margin:12px 0;background:#1e1e1e}
.item{display:flex;justify-content:space-between;align-items:center;margin:8px 0;padding:6px;border:1px solid #444;border-radius:4px}
.btn-group{margin-top:12px;text-align:center}
button{padding:8px 12px;font-size:15px;margin:0 4px;background:#4cd964;border:none;color:#000;border-radius:6px}
#applySettingBtn{background:#2563eb;color:#fff}
#startGameBtn{background:#4cd964;color:#000}
.joystick{margin-top:20px;display:grid;grid-template-columns:70px 70px 70px;grid-template-rows:70px 70px;gap:8px;justify-content:center}
.joystick button{width:70px;height:70px;font-size:26px;margin:0;border-radius:10px;background:#27ae60;font-weight:bold}
.void{background:transparent !important;border:none !important}
#takeBtn{width:100%;padding:12px;border:none;background:#2563eb;color:#fff;border-radius:6px;font-size:16px;margin-top:10px}
#captureBtn{width:100%;padding:12px;border:none;background:#28a745;color:#fff;border-radius:6px;font-size:16px;margin-top:10px}
#videoEle{width:100%;border-radius:8px;margin-top:10px;display:block}
input[type="range"]{width:100%;margin:6px 0}
.chess-wrap{max-width:360px;margin:15px auto 0;text-align:center}
#boardFive{background:#DEB887;border:3px solid #8b572a}
#boardGo{background:#DEB887;border:3px solid #8b572a;display:none}
.chess-ctrl{margin:10px 0;gap:8px;display:flex;justify-content:center;flex-wrap:wrap}
.tip-text{font-size:17px;margin:8px 0;color:#ffd769}
#imgBox img{
    width:100%;
    border-radius:10px;
    border:2px solid #60a5fa;
    margin-bottom:15px;
}
</style>

<body>
<div class="title-sign">本页面由王忆轩借助AI编写生成</div>
<button id="fullBtn" onclick="toggleFull()">全屏</button>
<button id="musicJumpBtn" onclick="jumpMusic()">跳转忘川彼岸(网易云)</button>
<img class="qiling-avatar" src="https://p3.toutiaoimg.com/tos-cn-i-6w9my0ksvp/43623e20803b4408990201771d314111~tplv-6w9my0ksvp-image.image" alt="褚嬴棋魂">

<div class="tab-box">
<button class="tab" onclick="switchPage('camera')">自拍相机</button>
<button class="tab" onclick="switchPage('贪吃蛇')">贪吃蛇游戏</button>
<button class="tab" onclick="switchPage('chess')">五子棋&围棋</button>
</div>

<!--相机模块：大图在上，摄像头在下，默认首页 -->
<div id="camera">
<h3>前置自拍工具</h3>
<div id="imgBox"></div>
<video id="videoEle" autoplay playsinline muted></video>
<button id="captureBtn">点击拍照</button>
<canvas id="shotCanvas" style="display:none"></canvas>
</div>

<!--贪吃蛇模块-->
<div id="贪吃蛇" class="hide">
<div class="info">本局分数：<span id="score">0</span>｜永久总积分：<span id="totalScore">0</span></div>
<div class="panel">
<h4>🎮 参数自定义</h4>
<div>
<label>移动间隔(越小越快)：<span id="speedVal">120</span>ms</label>
<input type="range" id="speedSlider" min="40" max="250" value="120">
</div>
<div>
<label>基础格子大小：<span id="sizeVal">16</span></label>
<input type="range" id="sizeSlider" min="12" max="32" value="16">
</div>
<div style="text-align:center;margin-top:10px">
<button id="applySettingBtn">应用本局参数</button>
</div>
</div>
<div class="panel">
<h4>🏪技能商店</h4>
<div class="item"><span>⚡加速(50积分)</span><button onclick="buySkill('speed',50)">购买</button></div>
<div class="item"><span>🌌穿墙(100积分)</span><button onclick="buySkill('passwall',100)">购买</button></div>
<div class="item"><span>🛡护盾×1(150积分)</span><button onclick="buySkill('shield',150)">购买</button></div>
</div>
<canvas id="gameCanvas" width="320" height="320"></canvas>
<div class="btn-group">
<button id="startGameBtn">开始游戏</button>
</div>
<div class="joystick">
<div class="void"></div>
<button ontouchstart="setDir('UP')">↑</button>
<div class="void"></div>
<button ontouchstart="setDir('LEFT')">←</button>
<div class="void"></div>
<button ontouchstart="setDir('RIGHT')">→</button>
<div class="void"></div>
<button ontouchstart="setDir('DOWN')">↓</button>
<div class="void"></div>
</div>
</div>

<!--棋类模块（纯双人，无AI）-->
<div id="chess" class="hide">
<div class="tip-text" id="chessTip">随机先手，双击棋盘落子</div>
<div class="chess-ctrl">
<button onclick="switchChess(5)">五子棋15路</button>
<button onclick="switchChess(19)">围棋19路</button>
<button onclick="resetChess()">重新开局</button>
<button onclick="undoChess()">悔棋一步</button>
</div>
<div class="chess-wrap">
<canvas id="boardFive" width="360" height="360"></canvas>
<canvas id="boardGo" width="360" height="360"></canvas>
</div>
</div>

<script>
//跳转网易云歌曲
function jumpMusic(){
    window.open("https://music.163.com/#/song?id=1480330021","_blank");
}

//全屏功能修复
function toggleFull(){
    if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement) {
        document.documentElement.requestFullscreen().catch(e=>{});
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
    }
}

//页面切换逻辑，默认打开相机
function switchPage(type){
    document.querySelectorAll("#camera,#贪吃蛇,#chess").forEach(el=>el.classList.add("hide"));
    document.getElementById(type).classList.remove("hide");
    if(type==='贪吃蛇') loadTotalScore();
    if(type==='chess') initChess();
}
//页面加载默认显示相机，不会空白
switchPage('camera');

//相机逻辑：刷新自动拍一次，大图展示在上
const videoEle = document.getElementById('videoEle');
const shotCanvas = document.getElementById('shotCanvas');
const ctxShot = shotCanvas.getContext('2d');
const imgBox = document.getElementById('imgBox');
let hasAutoCaptured = false;
function doCapture(){
    shotCanvas.width = videoEle.videoWidth;
    shotCanvas.height = videoEle.videoHeight;
    ctxShot.drawImage(videoEle,0,0);
    const url = shotCanvas.toDataURL("image/png");
    imgBox.innerHTML = `<img src="${url}"><a download="自拍.png"><button id="takeBtn">保存图片</button></a>`;
}
(async ()=>{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
    videoEle.srcObject = stream;
    videoEle.addEventListener("loadeddata",()=>{
        if(!hasAutoCaptured){doCapture();hasAutoCaptured=true;}
    })
})()
document.getElementById("captureBtn").onclick = doCapture;

//贪吃蛇逻辑
let snake,food,dir,nextDir,score,gameLoop;
let userSpeed = 120, userSize = 16, box = userSize;
let skill={speed:false,passwall:false,shield:0};
const scoreEl = document.getElementById("score");
const totalScoreEl = document.getElementById("totalScore");
const speedSlider = document.getElementById("speedSlider");
const sizeSlider = document.getElementById("sizeSlider");
const speedVal = document.getElementById("speedVal");
const sizeVal = document.getElementById("sizeVal");
speedSlider.oninput = ()=>speedVal.textContent = speedSlider.value;
sizeSlider.oninput = ()=>sizeVal.textContent = sizeSlider.value;
document.getElementById("applySettingBtn").onclick = ()=>{
    userSpeed = Number(speedSlider.value);
    userSize = Number(sizeSlider.value);
    alert("参数已保存，新开一局生效");
}
function loadTotalScore(){
    let s = localStorage.getItem("snakeTotalScore")||0;
    totalScoreEl.innerText = s;
}
function saveTotalScore(add){
    let s = Number(localStorage.getItem("snakeTotalScore"))+add;
    localStorage.setItem("snakeTotalScore",s);
    totalScoreEl.innerText = s;
}
function buySkill(name,cost){
    let total = Number(localStorage.getItem("snakeTotalScore"));
    if(total < cost) return alert("积分不足");
    total -= cost;
    localStorage.setItem("snakeTotalScore",total);
    totalScoreEl.innerText = total;
    name==="shield" ? skill.shield++ : skill[name]=true;
    alert("购买成功，本局可用");
}
function setDir(d){
    if(dir==="UP"&&d==="DOWN")return;
    if(dir==="DOWN"&&d==="UP")return;
    if(dir==="LEFT"&&d==="RIGHT")return;
    if(dir==="RIGHT"&&d==="LEFT")return;
    nextDir = d;
}
function init(){
    box = userSize;
    snake = [{x:box*4,y:box*4}];
    dir = nextDir = "RIGHT";
    score = 0;
    skill={speed:false,passwall:false,shield:0};
    scoreEl.textContent = score;
    spawnFood();
}
function spawnFood(){
    food = {
        x:Math.floor(Math.random()*(320/box))*box,
        y:Math.floor(Math.random()*(320/box))*box
    }
}
function draw(){
    const ctx = document.getElementById("gameCanvas").getContext("2d");
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,320,320);
    ctx.font = `${box-1}px sans-serif`;
    ctx.fillText("🍎",food.x,food.y+box-2);
    ctx.fillStyle="#4cd964";
    snake.forEach(p=>ctx.fillRect(p.x,p.y,box-2,box-2));
}
function update(){
    dir = nextDir;
    let head = {...snake[0]};
    switch(dir){
        case "UP": head.y -= box;break;
        case "DOWN": head.y += box;break;
        case "LEFT": head.x -= box;break;
        case "RIGHT": head.x += box;break;
    }
    if(skill.passwall){
        if(head.x<0) head.x=320-box;
        if(head.x>=320) head.x=0;
        if(head.y<0) head.y=320-box;
        if(head.y>=320) head.y=0;
    }else{
        if(head.x<0||head.x>=320||head.y<0||head.y>=320){
            if(skill.shield>0){skill.shield--;alert(`护盾剩余${skill.shield}`);return;}
            clearInterval(gameLoop);
            saveTotalScore(score);
            return alert(`游戏结束，得分${score}`);
        }
    }
    for(let p of snake){
        if(head.x===p.x&&head.y===p.y){
            if(skill.shield>0){skill.shield--;alert(`护盾剩余${skill.shield}`);return;}
            clearInterval(gameLoop);
            saveTotalScore(score);
            return alert(`游戏结束，得分${score}`);
        }
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){
        score +=10;
        scoreEl.textContent = score;
        if(box<24) box +=0.4;
        spawnFood();
    }else snake.pop();
    draw();
}
document.getElementById("startGameBtn").onclick = ()=>{
    clearInterval(gameLoop);
    init();draw();
    let delay = skill.speed ? 70 : userSpeed;
    gameLoop = setInterval(update,delay);
}
document.addEventListener("keydown",e=>{
    const map = {ArrowUp:"UP",ArrowDown:"DOWN",ArrowLeft:"LEFT",ArrowRight:"RIGHT"};
    if(map[e.key]) setDir(map[e.key]);
})

//双人五子棋围棋 修复棋盘空白问题
let chessCtx, gridNum, cell, boardSize = 36;
let chessMap, historyList, curBlackTurn;
const chessTip = document.getElementById("chessTip");
function switchChess(num){
    gridNum = num === 5 ? 15 : 19;
    const five = document.getElementById("boardFive");
    const go = document.getElementById("boardGo");
    five.style.display = num === 15 ? "block" : "none";
    go.style.display = num === 19 ? "block" : "none";
    //每次切换重新获取画布上下文，修复空白
    chessCtx = num === 15 ? five.getContext("2d") : go.getContext("2d");
    cell = boardSize / gridNum;
    resetChess();
}
function initChess(){switchChess(15);}
function resetChess(){
    chessMap = Array(gridNum).fill().map(()=>Array(gridNum).fill(0));
    historyList = [];
    curBlackTurn = Math.random()>0.5;
    chessTip.innerText = curBlackTurn ? "黑子回合" : "白子回合";
    drawBoard();
}
function drawBoard(){
    chessCtx.clearRect(0,0,boardSize,boardSize);
    chessCtx.strokeStyle="#333";
    for(let i=0;i<=gridNum;i++){
        chessCtx.beginPath();
        chessCtx.moveTo(i*cell,0);
        chessCtx.lineTo(i*cell,boardSize);
        chessCtx.stroke();
        chessCtx.beginPath();
        chessCtx.moveTo(0,i*cell);
        chessCtx.lineTo(boardSize,i*cell);
        chessCtx.stroke();
    }
    historyList.forEach(item=>drawPiece(item.x,item.y,item.val));
}
function drawPiece(x,y,type){
    chessCtx.beginPath();
    chessCtx.arc(x*cell+cell/2, y*cell+cell/2, cell*0.42, 0, Math.PI*2);
    chessCtx.fillStyle = type===1 ? "#000" : "#fff";
    chessCtx.fill();
    chessCtx.strokeStyle="#222";
    chessCtx.stroke();
}
["boardFive","boardGo"].forEach(id=>{
    const cvs = document.getElementById(id);
    cvs.ondblclick = function(e){
        const rect = this.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;
        const x = Math.floor(px / cell);
        const y = Math.floor(py / cell);
        if(x<0||y<0||x>=gridNum||y>=gridNum||chessMap[y][x]!==0) return;
        const val = curBlackTurn ? 1 : 2;
        chessMap[y][x] = val;
        historyList.push({x,y,val});
        drawPiece(x,y,val);
        if(gridNum===15 && checkWin(x,y,val)){
            setTimeout(()=>alert(val===1?"黑子获胜":"白子获胜"),200);
        }
        curBlackTurn = !curBlackTurn;
        chessTip.innerText = curBlackTurn ? "黑子回合" : "白子回合";
    }
})
//修复函数参数缺失bug
function checkWin(px,py,val){
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    for(let [dx,dy] of dirs){
        let cnt = 1;
        for(let s=1;s<5;s++){
            let nx = px+dx*s, ny = py+dy*s;
            if(nx>=0&&ny>=0&&nx<gridNum&&ny<gridNum&&chessMap[ny][nx]===val) cnt++;
            else break;
        }
        for(let s=1;s<5;s++){
            let nx = px-dx*s, ny = py-dy*s;
            if(nx>=0&&ny>=0&&nx<gridNum&&ny<gridNum&&chessMap[ny][nx]===val) cnt++;
            else break;
        }
        if(cnt>=5) return true;
    }
    return false;
}
function undoChess(){
    if(historyList.length===0) return alert("无棋子可悔");
    const last = historyList.pop();
    chessMap[last.y][last.x] = 0;
    curBlackTurn = !curBlackTurn;
    chessTip.innerText = curBlackTurn ? "黑子回合" : "白子回合";
    drawBoard();
}
</script>
</body>
