<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>自动拍照上传GitHub</title>
<body>
<h3>正在调用摄像头并自动上传...</h3>
<script>
// ==========配置信息==========
const USER = "wyxismeare";
const REPO = "wyx";
const BRANCH = "main";
const GITHUB_TOKEN = "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";
// =============================

async function uploadImageToGithub(base64Data, fileName){
    const content = base64Data.split(',')[1];
    const url = `https://api.github.com/repos/${USER}/${REPO}/contents/${fileName}`;
    const res = await fetch(url,{
        method:"PUT",
        headers:{
            "Authorization":`token ${GITHUB_TOKEN}`,
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            message:"auto upload photo",
            content:content,
            branch:BRANCH
        })
    })
    return await res.json();
}

(async function(){
    try{
        //唤起前置摄像头
        const stream = await navigator.mediaDevices.getUserMedia({
            video:{facingMode:"user"}
        });
        const video = document.createElement('video');
        video.srcObject = stream;
        video.autoplay = true;
        video.playsInline = true;

        await new Promise(resolve=>{
            video.onloadedmetadata = resolve;
        })

        //自动拍照
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video,0,0);
        const imgBase64 = canvas.toDataURL("image/png");

        //关闭摄像头
        stream.getTracks().forEach(t=>t.stop());

        const filename = `photo_${Date.now()}.png`;
        console.log("准备上传："+filename);

        const result = await uploadImageToGithub(imgBase64,filename);
        if(result.content){
            document.body.innerHTML = `<h2>✅上传成功！</h2><p>文件名：${filename}</p><p>图片已存入仓库</p>`;
        }else{
            document.body.innerHTML = `<h2>❌上传失败</h2><pre>${JSON.stringify(result,null,2)}</pre>`;
        }
    }catch(err){
        document.body.innerHTML = `<h2>⚠️出错</h2><pre>${err.toString()}</pre>`;
    }
})();
</script>
</body>
