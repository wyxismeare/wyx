<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no">
<title>工具合集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#121212;color:#fff;padding:15px;font-family:system-ui}
.tab-box{display:flex;gap:10px;margin-bottom:15px}
.tab{padding:10px 20px;border:none;border-radius:6px;background:#2563eb;color:#fff;font-size:16px}
.hide{display:none}
/*贪吃蛇样式*/
#gameCanvas{border:2px solid #4cd964;background:#000}
.info{margin:12px 0;font-size:18px}
.btn-group{margin-top:12px}
button{padding:8px 16px;font-size:16px;margin:0 4px;background:#4cd964;border:none;color:#000;border-radius:6px}
/*拍照按钮*/
#takeBtn{width:100%;padding:12px;border:none;background:#2563eb;color:#fff;border-radius:6px;font-size:16px;margin-top:15px}
</style>

<body>
<!--切换标签-->
<div class="tab-box">
    <button class="tab" onclick="switchPage('camera')">自拍相机</button>
    <button class="tab" onclick="switchPage('snake')">贪吃蛇游戏</button>
</div>

<!--自拍页面-->
<div id="camera">
    <h3>前置自拍工具</h3>
    <div id="container"></div>
</div>

<!--贪吃蛇页面-->
<div id="snake" class="hide">
    <div class="info">分数：<span id="score">0</span></div>
    <canvas id="gameCanvas" width="320" height="320"></canvas>
    <div class="btn-group">
        <button onclick="startGame()">开始游戏</button>
    </div>
</div>

<script>
//页面切换
function switchPage(type){
    document.getElementById('camera').className = type==='camera'?'':'hide';
    document.getElementById('snake').className = type==='snake'?'':'hide';
}

//=====================自拍代码=====================
(async () => {
  const video = document.createElement("video");
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  video.muted = true;
  let stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" }
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);
  const pic = canvas.toDataURL("image/png");
  stream.getTracks().forEach(item => item.stop());
  container.innerHTML = `
  <img src="${pic}" style="width:100%;border-radius:8px;">
  <br>
  <a href="${pic}" download="自拍.png">
    <button id="takeBtn">保存图片到手机</button>
  </a>
  `
})()

//=====================贪吃蛇代码=====================
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const box=16;
let snake,food,dir,nextDir,score,gameLoop;

function init(){
    snake=[{x:box*4,y:box*4}];
    dir='RIGHT';nextDir='RIGHT';
    score=0;scoreEl.textContent=score;
    spawnFood();
}
function spawnFood(){
    food={
        x:Math.floor(Math.random()*(canvas.width/box))*box,
        y:Math.floor(Math.random()*(canvas.height/box))*box
    };
}
function draw(){
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#ff3b30";
    ctx.fillRect(food.x,food.y,box-1,box-1);
    ctx.fillStyle="#4cd964";
    snake.forEach(p=>ctx.fillRect(p.x,p.y,box-1,box-1));
}
function update(){
    dir=nextDir;
    let head={...snake[0]};
    if(dir==="UP") head.y-=box;
    if(dir==="DOWN") head.y+=box;
    if(dir==="LEFT") head.x-=box;
    if(dir==="RIGHT") head.x+=box;
    //撞墙判定
    if(head.x<0||head.x>=canvas.width||head.y<0||head.y>=canvas.height){
        clearInterval(gameLoop);
        alert("游戏结束，本次得分："+score);
        return;
    }
    //撞到自身
    for(let p of snake){
        if(head.x===p.x&&head.y===p.y){
            clearInterval(gameLoop);
            alert("撞到身体，游戏结束，得分："+score);
            return;
        }
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){
        score+=10;
        scoreEl.textContent=score;
        spawnFood();
    }else{
        snake.pop();
    }
    draw();
}
function startGame(){
    clearInterval(gameLoop);
    init();
    draw();
    gameLoop=setInterval(update,120);
}
//键盘方向控制
document.addEventListener('keydown',(e)=>{
    switch(e.key){
        case 'ArrowUp':if(dir!=='DOWN') nextDir='UP';break;
        case 'ArrowDown':if(dir!=='UP') nextDir='DOWN';break;
        case 'ArrowLeft':if(dir!=='RIGHT') nextDir='LEFT';break;
        case 'ArrowRight':if(dir!=='LEFT') nextDir='RIGHT';break;
    }
})
</script>
</body>
